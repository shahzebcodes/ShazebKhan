name: Generate Snake Animation

on:
  schedule:
    # Runs every day at midnight UTC (updates your snake daily)
    - cron: "0 0 * * *"
  workflow_dispatch:  # Allows you to run it manually anytime

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Generate the snake SVG files from your contribution grid
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: shahzebcodes      # <-- replace with your GitHub username
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Push the generated snake to the "output" branch
      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
